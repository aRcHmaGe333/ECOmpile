[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecompile-v2"
version = "0.1.0"
description = "ECOmpile v2 pipeline for convergent outcome kernels"
requires-python = ">=3.10"

[project.scripts]
ecov2 = "ecov2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
